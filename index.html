<!DOCTYPE html> 
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Task Tracker</h1>

        <div class="input-section">
            <input type="text" id="taskInput" placeholder="Neue Aufgabe eingeben...">
            <button id="addTaskBtn">Hinzufügen</button>
        </div>

        <div class="filter-section">
            <button class="filter-btn" data-filter="all">Alle</button>
            <button class="filter-btn" data-filter="open">Offen</button>
            <button class="filter-btn" data-filter="completed">Erledigt</button>
        </div>

        <p id="taskCounter">0 Aufgaben offen</p>
        <button id="clearCompletedBtn">Erledigte löschen</button>

        <p id="emptyState">Noch keine Aufgaben vorhanden</p>

        <ul id="taskList">
            <!--Aufgaben kommen hier rein-->
        </ul>

    </div>

    <script src="script.js"></script>
</body>
</html>
